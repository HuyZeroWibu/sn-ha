<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Chúc mừng sinh nhật Vũ Khánh Hà 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="yt" aria-hidden="true"></div>

<!-- Thanh trên cùng -->
<header class="topbar">
  <button class="btn sm" id="skipBtn" hidden>Bỏ qua ⏭</button>
  <button class="btn sm" id="replayBtn" hidden>Xem lại ↺</button>
  <span class="grow"></span>
  <button class="btn sm" id="soundBtn" aria-pressed="true">Âm thanh: Bật</button>
  <button class="btn sm icon" id="gearBtn" aria-label="Cài đặt">⚙</button>
</header>

<!-- Cổng bắt đầu (cần 1 lần chạm để trình duyệt cho phép âm thanh) -->
<section class="stage on" id="gate">
  <button class="gate-btn" id="gateBtn">Chạm vào đây để bắt đầu 🎁</button>
</section>

<!-- Màn mở đầu -->
<section class="stage" id="intro">
  <button class="btn main shake" id="openBtn" hidden>Mở Thiệp Cho Vũ Khánh Hà</button>
</section>

<!-- Màn chúc mừng -->
<section class="stage" id="celebrate">
  <div class="scroll">
    <h1 class="title" id="title"></h1>
    <p class="sub" id="sub"></p>

    <svg class="cats" viewBox="0 0 300 230" role="img" aria-label="Hai chú mèo trắng bên bánh kem sinh nhật">
      <g id="catL">
        <polygon points="72,78 80,44 102,66" fill="#fff" stroke="#e6dce6" stroke-width="2"/>
        <polygon points="72,78 79,54 92,68" fill="#ffc4d8"/>
        <polygon points="138,70 134,40 112,62" fill="#fff" stroke="#e6dce6" stroke-width="2"/>
        <circle cx="105" cy="102" r="42" fill="#fff" stroke="#e6dce6" stroke-width="2"/>
        <path d="M86 96 q6 -9 12 0 M114 96 q6 -9 12 0" stroke="#4a3b4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M94 108 q11 22 22 0 z" fill="#ff8aa8" stroke="#4a3b4a" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="80" cy="108" r="6" fill="#ffb3cf" opacity=".7"/><circle cx="130" cy="108" r="6" fill="#ffb3cf" opacity=".7"/>
      </g>
      <g id="catR">
        <polygon points="238,76 232,44 212,66" fill="#fff" stroke="#e6dce6" stroke-width="2"/>
        <polygon points="172,70 178,44 198,64" fill="#fff" stroke="#e6dce6" stroke-width="2"/>
        <circle cx="205" cy="104" r="40" fill="#fff" stroke="#e6dce6" stroke-width="2"/>
        <polygon points="205,30 184,68 226,68" fill="#6fb5ff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="205" cy="28" r="6" fill="#ffd54a"/>
        <path d="M188 98 q6 -9 12 0 M212 98 q6 -9 12 0" stroke="#4a3b4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M195 110 q10 20 20 0 z" fill="#ff8aa8" stroke="#4a3b4a" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="182" cy="110" r="6" fill="#ffb3cf" opacity=".7"/><circle cx="228" cy="110" r="6" fill="#ffb3cf" opacity=".7"/>
      </g>
      <!-- bánh kem -->
      <rect x="50" y="138" width="200" height="76" rx="12" fill="#fff1c9"/>
      <rect x="50" y="130" width="200" height="30" rx="15" fill="#ff9fc3"/>
      <g fill="#ff9fc3"><circle cx="80" cy="162" r="8"/><circle cx="130" cy="166" r="9"/><circle cx="178" cy="162" r="8"/><circle cx="222" cy="165" r="9"/></g>
      <rect x="146" y="96" width="8" height="36" rx="3" fill="#7fd1ff"/>
      <ellipse class="flame" cx="150" cy="88" rx="6" ry="10" fill="#ffb02e"/>
      <ellipse cx="86" cy="148" rx="13" ry="9" fill="#fff" stroke="#e6dce6" stroke-width="2"/>
      <ellipse cx="124" cy="148" rx="13" ry="9" fill="#fff" stroke="#e6dce6" stroke-width="2"/>
      <ellipse cx="178" cy="148" rx="13" ry="9" fill="#fff" stroke="#e6dce6" stroke-width="2"/>
      <ellipse cx="216" cy="148" rx="13" ry="9" fill="#fff" stroke="#e6dce6" stroke-width="2"/>
    </svg>

    <article class="letter-wrap" id="bookWrap">
      <div class="glass letter" id="letter">
        <h2 id="pgTitle"></h2>
        <div id="pgText"></div>
      </div>
      <nav class="pager">
        <button class="btn sm" id="prevBtn">‹ Trang trước</button>
        <span id="pgNum"></span>
        <button class="btn sm" id="nextBtn">Trang tiếp ›</button>
      </nav>
    </article>
  </div>
</section>

<!-- Cài đặt -->
<aside class="glass panel" id="panel" hidden>
  <h3>Cài đặt</h3>
  <label class="row"><span>Sách kỷ niệm</span><input type="checkbox" id="optBook"></label>
  <label class="row"><span>Nhạc nền</span><input type="checkbox" id="optMusic"></label>
  <label class="row"><span>Confetti khi chạm</span><input type="checkbox" id="optConfetti"></label>
  <label class="row"><span>Màu mưa chữ</span>
    <select id="optRain">
      <option value="#ff2d95">Hồng</option>
      <option value="#b36bff">Tím</option>
      <option value="#3fd0ff">Xanh</option>
      <option value="#ffcf4d">Vàng</option>
    </select>
  </label>
  <button class="btn sm" id="closePanel">Đóng</button>
</aside>

<script src="script.js"></script>
</body>
</html>
